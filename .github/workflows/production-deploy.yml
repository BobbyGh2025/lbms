name: LBMS Production Deployment
# Automatic deployment pipeline: pushes to main validate and deploy LBMS to the isolated VPS app.
# CI/CD verification: production secrets are configured for automatic main-branch deployment.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lbms-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    # Prisma CLI requires DATABASE_URL during schema validation; this is CI-only and never used for deployment.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lbms_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-cache

      - name: Prepare PostgreSQL Prisma schema
        run: bun scripts/prepare-postgres-schema.mjs

      - name: Validate PostgreSQL Prisma schema
        run: bunx prisma validate --schema=prisma/schema.postgresql.prisma

      - name: Generate PostgreSQL Prisma client
        run: bunx prisma generate --schema=prisma/schema.postgresql.prisma

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Production build
        run: |
          ./node_modules/.bin/next build
          test -d ".next/standalone"
          rm -rf ".next/standalone/.next/static"
          cp -R ".next/static" ".next/standalone/.next/static"
          if [ -d "public" ]; then
            rm -rf ".next/standalone/public"
            cp -R "public" ".next/standalone/public"
          fi

  deploy:
    name: Deploy LBMS to VPS
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          LBMS_DEPLOY_KEY: ${{ secrets.LBMS_DEPLOY_KEY }}
          LBMS_VPS_HOST: ${{ secrets.LBMS_VPS_HOST }}
        run: |
          test -n "$LBMS_DEPLOY_KEY"
          test -n "$LBMS_VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LBMS_DEPLOY_KEY" > ~/.ssh/lbms_deploy
          chmod 600 ~/.ssh/lbms_deploy
          ssh-keyscan -H "$LBMS_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          LBMS_VPS_HOST: ${{ secrets.LBMS_VPS_HOST }}
        run: |
          set -euo pipefail
          echo "=== LBMS DEPLOY TARGET ==="
          ssh -i ~/.ssh/lbms_deploy -o IdentitiesOnly=yes lbmsdeploy@"$LBMS_VPS_HOST" \
            'echo "whoami: $(whoami)"; echo "hostname: $(hostname)"; echo "pwd-before: $(pwd)"'
          echo "=== RUNNING DEPLOY SCRIPT ==="
          ssh -i ~/.ssh/lbms_deploy -o IdentitiesOnly=yes lbmsdeploy@"$LBMS_VPS_HOST" \
            'set -euo pipefail; tmp="/tmp/lbms-deploy-production.sh"; trap '"'"'rm -f "$tmp"'"'"' EXIT; cat > "$tmp"; chmod 700 "$tmp"; /bin/bash "$tmp"' \
            < scripts/deploy-production.sh

      - name: Verify deployed VPS
        env:
          LBMS_VPS_HOST: ${{ secrets.LBMS_VPS_HOST }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/lbms_deploy -o IdentitiesOnly=yes lbmsdeploy@"$LBMS_VPS_HOST" 'bash -s' <<EOF
          set -e
          cd /home/lightworld/webapps/lbms
          echo "Expected commit: $EXPECTED_COMMIT"
          echo "VPS commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          echo "Checking LBMS port 3015..."
          curl -fsS --max-time 10 http://127.0.0.1:3015/ >/dev/null
          echo "VPS deployment verification passed."
      
      - name: Verify public HTTPS endpoint
        run: |
          set -euo pipefail
          echo "Checking https://lbms.lightworldtech.com/ ..."
          curl -fsS --max-time 20 --retry 3 --retry-delay 2 https://lbms.lightworldtech.com/ >/dev/null
          echo "Public HTTPS endpoint verification passed."
          EOF
